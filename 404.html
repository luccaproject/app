<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Store the URL path for retrieval by index.html
      var pathSegments = location.pathname.split('/').slice(1);
      
      // Remove empty segments and 'app' repository name
      pathSegments = pathSegments.filter(function(seg) { return seg.length > 0 && seg !== 'app'; });
      
      sessionStorage.redirect = '/' + 'app' + '/#/' + pathSegments.join('/') + location.search;
      
      // Redirect to the SPA
      location.replace(location.protocol + '//' + location.host + '/app' + location.search);
    </script>
  </head>
  <body>
  </body>
</html>
